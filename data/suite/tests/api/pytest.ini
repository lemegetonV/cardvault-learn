# Settings pytest reads every time it runs in this folder.
[pytest]
# Look for tests only in the tests/ folder.
testpaths = tests
# Let test files import config.py, helpers.py, api/ and data/ from this folder.
pythonpath = .
# Show one line per test with its result.
addopts = -v
# Labels we can put on tests to run a group of them, for example: pytest -m smoke
markers =
    smoke: a few quick tests that show the main features work
    database: tests that read a service's database directly (need access to Postgres)
    events: tests that read events from Kafka directly (need access to Kafka)
# Keep the log lines that api/client.py writes for each call. pytest shows them under
# a failing test ("Captured log call") and in the HTML report.
log_level = INFO
log_format = %(asctime)s %(message)s
log_date_format = %H:%M:%S
# kafka-python uses an old Python call that newer Pythons warn about. The warning is
# about the library, not about our tests, so hide it.
filterwarnings =
    ignore:read_text is deprecated:DeprecationWarning
    ignore:open_text is deprecated:DeprecationWarning
