[project]
name = "cardvault-api-tests"
version = "0.1.0"
description = "pytest + httpx API test suite for CardVault"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.2",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt[crypto]>=2.15",
    "pytest-xdist>=3.8",
    "allure-pytest>=2.16",
    "confluent-kafka>=2.12",
    "jsonschema>=4.25",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardvault_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: a fast check that the stack is up and the main paths answer",
    "serial: changes something every service shares (the clock, faults, mock controls); left out of parallel runs, run with -m serial",
    "slow: waits on retries, timeouts or delayed callbacks",
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# TypeVar is kept over PEP 695 generics: it reads more plainly to someone new to Python.
ignore = ["UP047"]
